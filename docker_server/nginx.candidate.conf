server {
    listen 80;
    index index.php index.html;
    server_name ec2-18-141-236-192.ap-southeast-1.compute.amazonaws.com;
    root /var/www/html/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}


#!/bin/bash
set -e

#######################################
# CONFIG
#######################################
APP_DIR="/var/www/nika"
RELEASES_DIR="$APP_DIR/releases"
SHARED_DIR="$APP_DIR/shared"
CURRENT_LINK="$APP_DIR/current"
REPO_URL="https://github.com/soraspire/Nika.git"
BRANCH="candidate"

KEEP_RELEASES=5
TIMESTAMP=$(date +%Y%m%d%H%M%S)
NEW_RELEASE="$RELEASES_DIR/$TIMESTAMP"

echo "🚀 Deploying release $TIMESTAMP"

# 1. Create release folder
mkdir -p "$NEW_RELEASE"

# 2. Clone code
echo "📦 Cloning repository..."
git clone -b "$BRANCH" "$REPO_URL" "$NEW_RELEASE"

# 3. Link shared files
echo "🔗 Linking shared resources..."
ln -s "$SHARED_DIR/.env" "$NEW_RELEASE/.env"
ln -s "$SHARED_DIR/storage" "$NEW_RELEASE/storage"

# 4. Switch symlink (atomic)
echo "🔄 Switching current symlink..."
ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

# 5. Install dependencies
echo "📚 Installing composer dependencies..."
docker exec nika_app composer install

# 6. Run migrations
echo "🧬 Running migrations..."
docker exec nika_app php artisan migrate

# 7. Optimize
echo "⚡ Optimizing Laravel..."
docker exec nika_app php artisan optimize

#######################################
# CLEAN OLD RELEASES
#######################################
echo "🧹 Cleaning old releases..."
cd "$RELEASES_DIR"
ls -1dt */ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf

echo "✅ Deploy completed successfully!"
